<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Wesley Matos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 24px;
    background: #000000;
    color: rgba(255, 255, 255, 0.72);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 3.75rem;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -0.02em;
    background-image: linear-gradient(90deg, #ffffff, #9b9b9b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  p { margin: 0; font-size: 1rem; line-height: 1.5rem; }
  .code { color: rgba(255, 255, 255, 0.48); font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.75rem; line-height: 1rem; letter-spacing: 0.04em; }
  .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1rem;
    line-height: 1.5rem;
    font-weight: 600;
    transition: opacity 300ms cubic-bezier(0.22, 1, 0.36, 1), background-color 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  a:active { transform: translateY(1px); }
  .primary { background: #ffffff; color: #000000; }
  .primary:hover { opacity: 0.85; }
  .secondary { color: #ffffff; }
  .secondary:hover { background: #1F1F1F; }
  a:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
</style>
</head>
<body>
<h1>404</h1>
<p>That page doesn't exist. The work I ship does.</p>
<p class="code">NO BUILD STEP · STATIC BY DESIGN</p>
<div class="actions">
  <a class="primary" href="/">Back home</a>
  <a class="secondary" href="mailto:wesleymatosdev@gmail.com">Email me</a>
</div>
</body>
</html>
